name: Publish containers

on:
  push:
    branches: [main]
    paths:
      - shared/Dockerfile.base
      - platforms/*/Dockerfile
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: will-code-for-food-inc

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/romhack-base
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: shared
          file: shared/Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=romhack-base
          cache-to: type=gha,mode=max,scope=romhack-base

  build-platforms:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: neshax,  dir: platforms/nes  }
          - { name: sneshax, dir: platforms/snes }
          - { name: gbchax,  dir: platforms/gbc  }
          - { name: genhax,  dir: platforms/gen  }
          - { name: dshax,   dir: platforms/ds   }
          - { name: n64hax,  dir: platforms/n64  }
          - { name: ps1hax,  dir: platforms/ps1  }
          - { name: gbahax,  dir: platforms/gba  }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Platform Dockerfiles use `FROM romhack-base`. Pull the freshly built
      # GHCR image and retag it locally so Docker resolves the name correctly
      # without requiring Dockerfile changes.
      - name: Pull and retag romhack-base
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.ORG }}/romhack-base:latest
          docker tag ${{ env.REGISTRY }}/${{ env.ORG }}/romhack-base:latest romhack-base

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.platform.name }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.platform.dir }}
          file: ${{ matrix.platform.dir }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.platform.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform.name }}
