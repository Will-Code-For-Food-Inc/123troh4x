[package]
name = "onmyoji"
version = "0.1.0"
edition = "2021"

[dependencies]
protocol = { path = "../protocol" }
rmcp = { version = "1.2.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
