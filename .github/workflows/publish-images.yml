name: Publish container images

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/will-code-for-food-inc

jobs:
  # ── Build and push romhack-base ─────────────────────────────────────────────
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push romhack-base
        run: |
          docker build \
            -f shared/Dockerfile.base \
            -t ${{ env.IMAGE_PREFIX }}/romhack-base:latest \
            -t ${{ env.IMAGE_PREFIX }}/romhack-base:${{ steps.meta.outputs.sha_tag }} \
            .
          docker push ${{ env.IMAGE_PREFIX }}/romhack-base:latest
          docker push ${{ env.IMAGE_PREFIX }}/romhack-base:${{ steps.meta.outputs.sha_tag }}

  # ── Build and push platform images (parallel) ───────────────────────────────
  build-platforms:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        platform: [nes, snes, gbc, gba, gen, ds, n64, ps1]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Pull romhack-base and retag locally
        run: |
          docker pull ${{ env.IMAGE_PREFIX }}/romhack-base:latest
          docker tag  ${{ env.IMAGE_PREFIX }}/romhack-base:latest romhack-base

      - name: Build and push ${{ matrix.platform }}hax
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.platform }}hax:latest \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.platform }}hax:${{ steps.meta.outputs.sha_tag }} \
            platforms/${{ matrix.platform }}/
          docker push ${{ env.IMAGE_PREFIX }}/${{ matrix.platform }}hax:latest
          docker push ${{ env.IMAGE_PREFIX }}/${{ matrix.platform }}hax:${{ steps.meta.outputs.sha_tag }}
